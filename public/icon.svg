<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="20%" y1="10%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="waterLevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle with Material 3 radius -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle concentric ripple glow -->
  <circle cx="256" cy="280" r="160" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />
  <circle cx="256" cy="280" r="120" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" />

  <!-- Main Water Droplet Shape -->
  <path d="M256 96 C256 96 152 232 152 312 C152 370 198.5 416 256 416 C313.5 416 360 370 360 312 C360 232 256 96 256 96 Z"
        fill="#ffffff"
        filter="url(#shadow)" />

  <!-- Inner fluid level gradient -->
  <path d="M168 316 C168 360 207 396 256 396 C305 396 344 360 344 316 C344 286 312 236 280 190 C268 174 256 156 256 156 C256 156 244 174 232 190 C200 236 168 286 168 316 Z"
        fill="url(#waterLevelGrad)" />

  <!-- Wave highlights and shine -->
  <path d="M190 320 C220 300 240 330 280 315 C305 305 325 315 335 320 C330 360 298 388 256 388 C220 388 195 365 190 320 Z"
        fill="#0284c7" opacity="0.6" />

  <!-- Specular glint -->
  <ellipse cx="220" cy="240" rx="14" ry="28" transform="rotate(-30 220 240)" fill="#ffffff" opacity="0.85" />
  <circle cx="238" cy="210" r="6" fill="#ffffff" opacity="0.9" />
</svg>
